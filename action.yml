name: harness-audit
description: >-
  Audit an agent-harness change A -> B for Selection, Activation, Attribution and
  Improvement evidence. Fails the job according to --fail-on.
author: Nguyễn Xuân Tự
branding:
  icon: check-square
  color: blue

inputs:
  runs:
    description: Path to the runs JSONL file (one RunRecord per line).
    required: true
  manifest:
    description: Path to the experiment manifest (YAML or JSON).
    required: false
    default: ""
  out:
    description: Directory for audit.json, report.md and report.html.
    required: false
    default: harness-audit-report
  fail-on:
    description: "Fail the step when any claim is at this verdict or worse: fail | partial | unknown | never."
    required: false
    default: fail
  python-version:
    description: Python version used to run harness-audit.
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: "0 = no claim at the --fail-on level, 1 = at least one, 2 = input error."
    value: ${{ steps.audit.outputs.exit-code }}
  report-dir:
    description: Directory with the generated reports.
    value: ${{ inputs.out }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install harness-audit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Run harness-audit
      id: audit
      shell: bash
      env:
        HA_RUNS: ${{ inputs.runs }}
        HA_MANIFEST: ${{ inputs.manifest }}
        HA_OUT: ${{ inputs.out }}
        HA_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        args=(audit "$HA_RUNS" --out "$HA_OUT" --fail-on "$HA_FAIL_ON")
        if [ -n "$HA_MANIFEST" ]; then args+=(--manifest "$HA_MANIFEST"); fi
        harness-audit "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$HA_OUT/report.md" ]; then cat "$HA_OUT/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
