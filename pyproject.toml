[project]
name = "harness-audit"
version = "0.1.0"
description = "Check whether an agent-harness change really improves the agent: Selection, Activation, Attribution and Improvement evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "evaluation", "harness", "llm", "claude-agent-sdk", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Nguyễn Xuân Tự", email = "nxuantu36@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
harness-audit = "harness_audit.cli:main"

[project.urls]
Repository = "https://github.com/xuan-tu-ai/harness-audit"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.2.178",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM"]
ignore = ["E501", "N802", "N803", "N806", "N815"]  # K, T, A, B follow the paper's notation

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/harness_audit/cli.py" = ["B008"]  # Typer declares options as argument defaults
