[project]
name = "harness-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nguyễn Xuân Tự", email = "nxuantu36@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.2.178",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
